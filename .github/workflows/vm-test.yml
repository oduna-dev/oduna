name: VM boot test

# Runs on pull requests that touch what the test boots (modules, the demo
# instance, the test itself, the flake and the secrets template the fixture
# derives from) and on demand.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - modules/**
      - tests/**
      - examples/**
      - secrets/secrets.example.yaml
      - flake.nix
      - flake.lock
      - .github/workflows/vm-test.yml
      - .github/workflows/nix-vm-check.yml

concurrency:
  group: vm-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vm-test:
    uses: ./.github/workflows/nix-vm-check.yml
    with:
      check: vm-test
