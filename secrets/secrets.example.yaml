# Template for secrets/secrets.yaml (sops-encrypted, committed).
# Workflow:
#   1. bootstrap.sh copies this to secrets/secrets.yaml and encrypts it in
#      place for every recipient in .sops.yaml
#   2. fill in real values:  nix run nixpkgs#sops -- secrets/secrets.yaml
#   3. commit the encrypted file only; never commit plaintext
caddy_inwx.env: |
  INWX_USERNAME=...
  INWX_PASSWORD=...
smtp_password: ...
# Shared break-glass admin identity consumed by homelab-converge (creating
# missing accounts, converging existing ones to this pair; rotate via sops
# edit or fetch-secrets --adopt-preseed). The email local part becomes the
# Forgejo username and must avoid Forgejo's reserved names (admin, root, ...).
admin.env: |
  ADMIN_EMAIL=...
  ADMIN_PASSWORD=...
# Relay app password only: the re-hashed ADMIN_TOKEN and the SSO entries
# live in the converge-owned vaultwarden converge.env file instead.
vaultwarden.env: |
  SMTP_PASSWORD=...
forgejo_runner_token: ...
netbird_setup_key: ...
immich.env: |
  DB_HOSTNAME=database
  DB_USERNAME=postgres
  DB_PASSWORD=...
  DB_DATABASE_NAME=immich
  JWT_SECRET=...
borg_passphrase: ...
# app password of the smtp relay for the authentik email stage (same value
# as smtp_password; postinstall copies it from the pre-seed).
authentik.env: |
  SECRET_KEY=...
  # Database password of the authentik compose stack's PostgreSQL instance.
  AUTHENTIK_PG_PASSWORD=...
  AUTHENTIK_BOOTSTRAP_PASSWORD=...
  AUTHENTIK_BOOTSTRAP_TOKEN=...
  AUTHENTIK_EMAIL__PASSWORD=...
  # The outpost token (AUTHENTIK_TOKEN) lives in the converge-owned
  # authentik outpost.env sibling file instead of sops.
healthchecks:
    heartbeat: ...
    hotbackup: ...
    borg: ...
